name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitu-snap
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build gitu snap
        uses: canonical/craft-actions/snapcraft/pack@67304fab78ef627dc3f2e72c8a6ad51a493a6070 # main as of 2026-06-11

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Run spread suites
        run: sudo snapcraft test

      - name: Upload spread artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spread-artifacts
          path: |
            .spread-reuse.*.yaml
            ~/.local/state/snapcraft/log/
