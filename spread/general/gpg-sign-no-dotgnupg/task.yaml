summary: Fail signing without dot-gnupg interface

execute: |
  set -eux

  snap disconnect gitu:dot-gnupg || true

  rm -rf /root/.gnupg /root/repo /root/sign-error.log
  install -d -m 700 /root/.gnupg
  install -d -m 755 /root/repo

  env HOME=/root GNUPGHOME=/root/.gnupg \
    gpg --batch --pinentry-mode loopback --passphrase '' \
    --quick-gen-key 'Spread GPG Tester <spread-gpg@example.com>' default default never

  KEY_ID=$(env HOME=/root GNUPGHOME=/root/.gnupg \
    gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')

  set +e
  env HOME=/root GNUPGHOME=/root/.gnupg \
    snap run --shell gitu -c "
      cd /root/repo &&
      git init . &&
      git config user.name 'Spread Tester' &&
      git config user.email 'spread-gpg@example.com' &&
      git config gpg.program gpg &&
      git config user.signingkey $KEY_ID &&
      git config commit.gpgsign true &&
      printf 'signed\\n' > README.md &&
      git add README.md &&
      git commit -m 'signed commit'
    " 2> /root/sign-error.log
  rc=$?
  set -e

  if [ "$rc" -eq 0 ]; then
    echo "Expected signing failure without dot-gnupg, but commit succeeded"
    exit 1
  fi

  if git -C /root/repo rev-parse --verify HEAD >/dev/null 2>&1; then
    echo "Expected no commit object without dot-gnupg, but HEAD exists"
    exit 1
  fi

  if ! grep -Eq 'gpg|sign' /root/sign-error.log; then
    echo "Expected a gpg-related failure in signing output"
    cat /root/sign-error.log
    exit 1
  fi

  if ! grep -q 'dot-gnupg is not connected' /root/sign-error.log; then
    echo "Expected disconnection warning in signing failure output"
    cat /root/sign-error.log
    exit 1
  fi

  if ! grep -q 'snap connect gitu:dot-gnupg' /root/sign-error.log; then
    echo "Expected manual connect hint in signing failure output"
    cat /root/sign-error.log
    exit 1
  fi

  snap connect gitu:dot-gnupg
