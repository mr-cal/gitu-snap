summary: Test gitu TUI rendering with --print and -k

execute: |
  set -eux

  rm -rf /root/tui-repo
  install -d -m 755 /root/tui-repo
  cd /root/tui-repo

  git init -b main .
  git config user.name "Spread Tester"
  git config user.email "spread@example.com"

  printf "hello world\n" > README.md
  git add README.md
  git commit -m "initial commit"

  # Test 1: Verify gitu --print renders the status screen
  output=$(snap run gitu --print)
  printf '%s\n' "$output" | grep -q "On branch main"
  printf '%s\n' "$output" | grep -q "Recent commits"
  printf '%s\n' "$output" | grep -q "initial commit"

  # Test 2: Verify gitu -k sends keystrokes on startup (opening help menu with 'h')
  help_output=$(snap run gitu -k h --print)
  printf '%s\n' "$help_output" | grep -Eq "(Help|Submenu)"

restore: |
  rm -rf /root/tui-repo
